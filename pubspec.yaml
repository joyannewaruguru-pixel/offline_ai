name: offline_ai
description: Offline AI Learning Platform - BIT4107 Final Project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  sensors_plus: ^5.0.0
  path_provider: ^2.1.3
  crypto: ^3.0.3
  percent_indicator: ^4.2.3
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/learnai_logo.png"
  adaptive_icon_background: "#1D9E75"
  adaptive_icon_foreground: "assets/images/learnai_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/